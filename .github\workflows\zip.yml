name: Extract ZIP to root

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          set -e
          
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP-файл не найден"
            exit 1
          fi
          
          echo "Найден архив: $ZIP_FILE"
          
          mkdir -p /tmp/extract
          unzip -q "$ZIP_FILE" -d /tmp/extract
          
          TOP_LEVEL=$(find /tmp/extract -mindepth 1 -maxdepth 1)
          COUNT=$(echo "$TOP_LEVEL" | wc -l)
          
          if [ "$COUNT" -eq 1 ] && [ -d "$TOP_LEVEL" ]; then
            echo "Обнаружена верхняя папка: $(basename "$TOP_LEVEL")"
            SOURCE="$TOP_LEVEL"
          else
            echo "Верхней папки нет — берём содержимое как есть"
            SOURCE="/tmp/extract"
          fi
          
          # Копируем всё
          shopt -s dotglob
          cp -a "$SOURCE"/. .
          
          # Удаляем workflow-файлы из ZIP, чтобы не было конфликта прав
          # (твой unzip.yml останется)
          rm -rf .github/workflows/*
          
          # Удаляем ZIP
          rm -f "$ZIP_FILE"
          rm -rf /tmp/extract
          
          echo "Содержимое после распаковки:"
          ls -la

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "chore: extract ZIP archive to repository root"
            git push
          fi
